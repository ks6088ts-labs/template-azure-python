# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: template-azure-python
site_url: https://ks6088ts-labs.github.io/template-azure-python
repo_url: https://github.com/ks6088ts-labs/template-azure-python
repo_name: ks6088ts-labs/template-azure-python
nav:
  - Getting started: index.md
  - Local development: scripts.md
  - Architecture: architecture/index.md
  - Azure samples:
      - Microsoft Foundry: foundry.md
      - Azure Cosmos DB: cosmosdb.md
      - Messaging: messaging.md
      - Monitoring and logs: monitoring.md
  - Deployment: deployment.md
theme:
  name: material
  # https://squidfunk.github.io/mkdocs-material/setup/changing-the-colors/#automatic-light-dark-mode
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  icon:
    repo: fontawesome/brands/github
  language: en
extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/ks6088ts/
    - icon: fontawesome/brands/github
      link: https://github.com/ks6088ts
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/ks6088ts
  analytics:
    provider: google
    property: G-0ZTKFXVQ5K
plugins:
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ja
          name: 日本語
          build: true
          nav_translations:
            Getting started: はじめに
            Local development: ローカル開発
            Architecture: アーキテクチャ
            Azure samples: Azure サンプル
            Messaging: メッセージング
            Monitoring and logs: 監視とログ
            Deployment: デプロイ
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
