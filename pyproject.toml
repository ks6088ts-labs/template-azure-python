[project]
name = "template-azure-python"
version = "0.0.1"
description = "A GitHub template repository for Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.14.3",
    "azure-ai-projects>=2.7.0",
    "azure-cosmos>=4.17.1",
    "azure-eventgrid>=4.22.1",
    "azure-eventhub>=5.15.1",
    "azure-functions>=1.25.0",
    "azure-identity>=1.25.3",
    "azure-mgmt-monitor>=7.0.0",
    "azure-mgmt-network>=33.0.0",
    "azure-monitor-opentelemetry>=1.8.10",
    "azure-monitor-query>=2.0.0",
    "azure-servicebus>=7.14.3",
    "azure-storage-queue>=12.18.0",
    "fastapi[standard]>=0.142.2",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic-settings>=2.9.1",
    "python-dotenv>=1.1.0",
    "requests>=2.34.2",
    "typer>=0.16.0",
]

[dependency-groups]
docs = [
    "mkdocs-material>=9.6.14",
    "mkdocs-static-i18n>=1.3.0",
]
test = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
]
dev = [
    { include-group = "test" },
    "coverage>=7.8.0",
    "import-linter>=2.9",
    "mypy>=1.18.2",
    "prek>=0.5.4,<0.6",
    "pyrefly>=0.44.1",
    "ruff>=0.11.7",
    "ty>=0.0.1a6",
    "zizmor>=1.30.1,<2",
]
notebook = [
    "jupyterlab>=4.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["D203"]

[tool.pytest.ini_options]
addopts = "-ra --cov=template_azure_python --cov=scripts --cov=function_app"
testpaths = ["tests"]
pythonpath = ['.']
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.coverage.report]
show_missing = true

[tool.ty]
environment = { python-version = "3.10" }

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[tool.mypy]
python_version = "3.10"
strict = true
files = [
    "template_azure_python/api.py",
    "template_azure_python/domain",
    "template_azure_python/application",
    "template_azure_python/infrastructure",
    "template_azure_python/presentation",
]

[tool.importlinter]
root_packages = ["template_azure_python"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture layers point inward"
type = "layers"
layers = [
    "template_azure_python.presentation | template_azure_python.infrastructure",
    "template_azure_python.application",
    "template_azure_python.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application are framework independent"
type = "forbidden"
source_modules = [
    "template_azure_python.domain",
    "template_azure_python.application",
]
forbidden_modules = [
    "azure",
    "fastapi",
    "pydantic",
    "template_azure_python.infrastructure",
    "template_azure_python.presentation",
]
