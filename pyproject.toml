[project]
name = "template-azure-python"
version = "0.0.1"
description = "A GitHub template repository for Python"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "azure-monitor-opentelemetry>=1.8.10",
    "fastapi>=0.143.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic-settings>=2.9.1",
    "python-dotenv>=1.1.0",
    "uvicorn>=0.54.0",
]
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
template-azure-python = "template_azure_python.__main__:main"

[project.optional-dependencies]
cosmos = [
    "azure-cosmos>=4.17.1",
    "azure-identity>=1.25.3",
]
duckdb = ["duckdb>=1.5.6"]
storage = [
    "azure-cosmos>=4.17.1",
    "azure-identity>=1.25.3",
    "duckdb>=1.5.6",
]
functions = ["azure-functions>=1.25.0"]
samples = [
    "aiohttp>=3.14.3",
    "azure-ai-projects>=2.7.0",
    "azure-cosmos>=4.17.1",
    "azure-eventgrid>=4.22.1",
    "azure-eventhub>=5.15.1",
    "azure-identity>=1.25.3",
    "azure-mgmt-monitor>=7.0.0",
    "azure-mgmt-network>=33.0.0",
    "azure-monitor-query>=2.0.0",
    "azure-servicebus>=7.14.3",
    "azure-storage-queue>=12.18.0",
    "duckdb>=1.5.6",
    "requests>=2.34.2",
    "typer>=0.16.0",
]

[dependency-groups]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.6.14,<10",
    "mkdocs-static-i18n>=1.3.0,<2",
]
test = [
    "httpx>=0.28.1",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
]
eval = [
    { include-group = "test" },
    "deepeval>=4.2.8,<5",
]
dev = [
    { include-group = "test" },
    "coverage>=7.8.0",
    "import-linter>=2.9",
    "mypy>=1.18.2",
    "prek>=0.5.4,<0.6",
    "ruff>=0.11.7",
    "zizmor>=1.30.1,<2",
]
type-eval = [
    "pyrefly>=0.44.1",
    "ty>=0.0.1a6",
]
notebook = [
    "jupyterlab>=4.4.2",
]
dbt = [
    "dbt>=2.0.6",
]

[build-system]
requires = ["uv_build==0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."

[tool.uv]
required-version = "==0.13.0"
exclude-newer = "7 days"
# Verified native telemetry and the pinned backend require shorter bootstrap windows.
exclude-newer-package = { fastapi = "3 days", uv-build = "3 days" }

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP",
    "S102", "S103", "S105", "S106", "S107", "S108", "S307", "S324", "S501", "S506", "S602",
    "B002", "B006", "B012", "B017", "B018", "B023", "B026", "B904",
    "ASYNC", "FAST002", "FAST003", "PERF102", "PERF203",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib -p no:deepeval --cov=template_azure_python --cov=scripts --cov=function_app"
testpaths = ["tests"]
markers = [
    "llm_eval: paid Foundry evaluations (requires --run-llm-evals)",
    "llm_eval_smoke: one small paid evaluation for checking connectivity",
]
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ty]
environment = { python-version = "3.13" }

[tool.ty.src]
exclude = ["tests/evaluations/**", "tests/test_evaluation_deepeval.py"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
project-excludes = ["tests/evaluations/**", "tests/test_evaluation_deepeval.py"]

[tool.mypy]
python_version = "3.13"
strict = true
files = [
    "template_azure_python/api.py",
    "template_azure_python/__main__.py",
    "template_azure_python/domain",
    "template_azure_python/application",
    "template_azure_python/infrastructure",
    "template_azure_python/presentation",
    "template_azure_python/settings",
    "template_azure_python/loggers.py",
    "template_azure_python/telemetry.py",
    "scripts/smoke_test.py",
    "scripts/init_template.py",
]

[tool.importlinter]
root_packages = ["template_azure_python"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture layers point inward"
type = "layers"
layers = [
    "template_azure_python.presentation | template_azure_python.infrastructure",
    "template_azure_python.application",
    "template_azure_python.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application are framework independent"
type = "forbidden"
source_modules = [
    "template_azure_python.domain",
    "template_azure_python.application",
]
forbidden_modules = [
    "azure",
    "duckdb",
    "fastapi",
    "pydantic",
    "template_azure_python.infrastructure",
    "template_azure_python.presentation",
    "template_azure_python.settings",
    "template_azure_python.internals",
]

[[tool.importlinter.contracts]]
name = "HTTP and composition root do not import storage SDKs directly"
type = "forbidden"
source_modules = [
    "template_azure_python.presentation",
    "template_azure_python.api",
]
forbidden_modules = ["azure", "duckdb"]
allow_indirect_imports = true
