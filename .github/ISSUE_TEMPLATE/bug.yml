name: Bug report
description: Report a reproducible problem. Use private reporting for vulnerabilities.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command, expected result, actual result, and sanitized output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and environment
      description: Python, uv, operating system, and repository version.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed credentials, personal information, and private Azure data.
          required: true
