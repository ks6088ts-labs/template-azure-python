name: infra
on:
  pull_request:
    paths: ['infra/**', '.github/workflows/infra.yml']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: infra-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          az bicep install --version v0.47.16
          az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/main.json"
          az bicep lint --file infra/main.bicep
