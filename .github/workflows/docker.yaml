name: docker

on:
  push:
    branches:
      - "main"
      - "feature/**"
  pull_request:
    branches:
      - "main"
permissions:
  contents: read
jobs:
  docker:
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # to retrieve git tags
          persist-credentials: false
      - name: Run CI tests for Docker
        shell: bash
        run: |
          make ci-test-docker
