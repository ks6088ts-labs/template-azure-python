name: deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Protected staging or production environment
        type: string
        required: true
      digest:
        description: Immutable GHCR sha256 digest from the trusted release workflow
        type: string
        required: true
      source-sha:
        description: CI-tested source commit; omitted only for an attested manual rollback
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: read
  attestations: read
  id-token: write

concurrency:
  group: container-app-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (inputs.environment == 'staging' || inputs.environment == 'production')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    defaults:
      run:
        shell: bash
    env:
      DIGEST: ${{ inputs.digest }}
      SOURCE_SHA: ${{ inputs.source-sha }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
    steps:
      - name: Validate deployment inputs
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Invalid digest" >&2; exit 1; }
          [[ -z "$SOURCE_SHA" || "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "Invalid source SHA" >&2; exit 1; }
          : "${RESOURCE_GROUP:?Set the environment RESOURCE_GROUP variable}"
          : "${CONTAINER_APP_NAME:?Set the environment CONTAINER_APP_NAME variable}"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify provenance and SBOM signed by the main release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          policy=(--repo "$GITHUB_REPOSITORY"
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cd.yaml"
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/cd.yaml@refs/heads/main"
            --source-ref refs/heads/main --deny-self-hosted-runners)
          if [[ -n "$SOURCE_SHA" ]]; then
            policy+=(--source-digest "$SOURCE_SHA")
          fi
          gh attestation verify "oci://$IMAGE@$DIGEST" "${policy[@]}"
          gh attestation verify "oci://$IMAGE@$DIGEST" "${policy[@]}" \
            --predicate-type https://spdx.dev/Document
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          version: "0.13.0"
          python-version: "3.14"
      - name: Authenticate to Azure using the protected environment's OIDC identity
        uses: azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy the verified immutable digest
        run: |
          mode=$(az containerapp show --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" --query properties.configuration.activeRevisionsMode --output tsv)
          [[ "$mode" == Single ]] || { echo "Configure single revision mode before using this rollout" >&2; exit 1; }
          az containerapp update --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" --image "$IMAGE@$DIGEST" --output none
          revision=$(az containerapp show --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" --query properties.latestRevisionName --output tsv)
          [[ -n "$revision" ]] || { echo "Deployment has no latest revision" >&2; exit 1; }
          ready=""
          for _ in {1..30}; do
            ready=$(az containerapp show --resource-group "$RESOURCE_GROUP" \
              --name "$CONTAINER_APP_NAME" --query properties.latestReadyRevisionName --output tsv)
            [[ "$ready" == "$revision" ]] && break
            sleep 5
          done
          [[ "$ready" == "$revision" ]] || { echo "The new revision did not become ready" >&2; exit 1; }
          actual=$(az containerapp revision show --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" --revision "$revision" \
            --query 'properties.template.containers[0].image' --output tsv)
          [[ "$actual" == "$IMAGE@$DIGEST" ]] || { echo "The ready revision is not the verified digest" >&2; exit 1; }
      - name: Retry the deployed application's health and API smoke checks
        run: |
          host=$(az containerapp show --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" --query properties.configuration.ingress.fqdn --output tsv)
          [[ "$host" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "No valid external ingress hostname" >&2; exit 1; }
          uv run --no-project --python 3.14 scripts/smoke_test.py \
            --base-url "https://$host" --attempts 30 --interval 5
