name: cd

# All privileged steps require a successful, same-repository main push CI run and its exact SHA.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.metadata.outputs.created }}
      new-release: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.metadata.outputs.sha }}
      image: ${{ steps.metadata.outputs.image }}
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Require the main tip to have passed CI
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {data} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            if (data.commit.sha !== context.payload.workflow_run.head_sha ||
                context.sha !== context.payload.workflow_run.head_sha) {
              core.setFailed('Refusing to release a main commit that has not passed this CI run');
            }
      - name: Create or update the conventional-commit release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
      - name: Verify the release tag resolves to the CI-tested commit
        id: metadata
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        with:
          script: |
            core.setOutput('created', 'false');
            const versionTag = /^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/;
            const componentTag = /^[A-Za-z0-9_.-]+?-(v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$/;
            function semanticVersion(tag) {
              return versionTag.test(tag) ? tag : tag.match(componentTag)?.[1];
            }
            async function resolveTag(tag) {
              const {data: ref} = await github.rest.git.getRef({...context.repo, ref: `tags/${tag}`});
              let object = ref.object;
              for (let depth = 0; object.type === 'tag' && depth < 5; depth++) {
                const {data} = await github.rest.git.getTag({...context.repo, tag_sha: object.sha});
                object = data.object;
              }
              return object;
            }
            let tag = process.env.RELEASE_TAG;
            if (!tag) {
              // Recover a published release on reruns without relying on bot-generated tag events.
              const {data: releases} = await github.rest.repos.listReleases({...context.repo, per_page: 30});
              for (const release of releases) {
                if (release.draft || !semanticVersion(release.tag_name)) continue;
                const object = await resolveTag(release.tag_name);
                if (object.type === 'commit' && object.sha === context.payload.workflow_run.head_sha) {
                  tag = release.tag_name;
                  break;
                }
              }
              if (!tag) return;
            }
            const version = semanticVersion(tag);
            if (!version) throw new Error('Release tag must be a semantic version');
            const object = await resolveTag(tag);
            if (object.type !== 'commit' || object.sha !== context.payload.workflow_run.head_sha) {
              throw new Error('Release tag is not the exact CI-tested commit');
            }
            const {data: release} = await github.rest.repos.getReleaseByTag({...context.repo, tag});
            if (release.draft) throw new Error('Draft releases cannot be published');
            core.setOutput('created', 'true');
            core.setOutput('sha', object.sha);
            core.setOutput('image', `ghcr.io/${process.env.GITHUB_REPOSITORY.toLowerCase()}`);
            core.setOutput('tag', version);
            core.setOutput('prerelease', String(release.prerelease || version.includes('-')));

  build:
    if: needs.release.outputs.created == 'true'
    needs: [release]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.artifact.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - name: Enable explicit ARM64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          version: "0.13.0"
          python-version: "3.14"
      - name: Reuse only an already attested build of this commit on reruns
        if: needs.release.outputs.new-release != 'true'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.release.outputs.image }}
          SOURCE_SHA: ${{ needs.release.outputs.sha }}
        run: |
          if manifest=$(docker buildx imagetools inspect "$IMAGE:sha-$SOURCE_SHA" \
            --format '{{json .Manifest}}' 2>.candidate-inspect-error); then
            digest=$(jq -er .digest <<< "$manifest")
            gh attestation verify "oci://$IMAGE@$digest" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cd.yaml" \
              --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/cd.yaml@refs/heads/main" \
              --source-ref refs/heads/main --source-digest "$SOURCE_SHA" --deny-self-hosted-runners
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            cat .candidate-inspect-error >&2
            grep -Eiq 'not found|manifest unknown|MANIFEST_UNKNOWN|NAME_UNKNOWN' .candidate-inspect-error || exit 1
          fi
      - name: Build the multi-architecture release once
        if: steps.existing.outputs.digest == ''
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ needs.release.outputs.image }}:sha-${{ needs.release.outputs.sha }}
          build-args: |
            GIT_REVISION=${{ needs.release.outputs.sha }}
            GIT_TAG=${{ needs.release.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.release.outputs.sha }}
          provenance: false
          sbom: false
      - name: Resolve the single immutable build artifact
        id: artifact
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Invalid build digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Pull and smoke-test both built platforms by immutable digest
        env:
          IMAGE: ${{ needs.release.outputs.image }}
          DIGEST: ${{ steps.artifact.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker pull --platform "$platform" "$IMAGE@$DIGEST"
            container=$(docker run --platform "$platform" -d -p 127.0.0.1::8000 "$IMAGE@$DIGEST")
            trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
            port=$(docker port "$container" 8000/tcp | sed 's/.*://')
            uv run --no-project --python 3.14 scripts/smoke_test.py \
              --base-url "http://127.0.0.1:$port" --attempts 30 --interval 2
            docker rm -f "$container" >/dev/null
            trap - EXIT
          done
      - name: Scan both pulled runtime platforms by immutable digest
        env:
          IMAGE: ${{ needs.release.outputs.image }}
          DIGEST: ${{ steps.artifact.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker pull --platform "$platform" "$IMAGE@$DIGEST"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --platform "$platform" --exit-code 1 --severity HIGH,CRITICAL \
              --ignore-unfixed "$IMAGE@$DIGEST"
          done
      - name: Generate the AMD64 SPDX SBOM from the built digest
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        env:
          SYFT_PLATFORM: linux/amd64
        with:
          image: ${{ needs.release.outputs.image }}@${{ steps.artifact.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          format: spdx-json
          syft-version: v1.54.1
          output-file: sbom-amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate the ARM64 SPDX SBOM from the built digest
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        env:
          SYFT_PLATFORM: linux/arm64
        with:
          image: ${{ needs.release.outputs.image }}@${{ steps.artifact.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          format: spdx-json
          syft-version: v1.54.1
          output-file: sbom-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the tested build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.release.outputs.image }}
          subject-digest: ${{ steps.artifact.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the AMD64 SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.release.outputs.image }}
          subject-digest: ${{ steps.artifact.outputs.digest }}
          sbom-path: sbom-amd64.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest the ARM64 SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.release.outputs.image }}
          subject-digest: ${{ steps.artifact.outputs.digest }}
          sbom-path: sbom-arm64.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Promote the same digest without rebuilding
        env:
          IMAGE: ${{ needs.release.outputs.image }}
          DIGEST: ${{ steps.artifact.outputs.digest }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          tags=("$RELEASE_TAG" "${RELEASE_TAG#v}")
          if [[ "$PRERELEASE" == false ]]; then
            tags+=(latest)
          fi
          for tag in "${tags[@]}"; do
            docker buildx imagetools create --prefer-index=false --tag "$IMAGE:$tag" "$IMAGE@$DIGEST"
            actual=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r .digest)
            [[ "$actual" == "$DIGEST" ]] || { echo "Promotion changed the artifact digest" >&2; exit 1; }
          done

  staging:
    if: vars.ENABLE_AZURE_DEPLOYMENTS == 'true'
    needs: [release, build]
    uses: ./.github/workflows/deploy.yaml
    permissions:
      contents: read
      packages: read
      attestations: read
      id-token: write
    with:
      environment: staging
      digest: ${{ needs.build.outputs.digest }}
      source-sha: ${{ needs.release.outputs.sha }}

  production:
    if: vars.ENABLE_AZURE_DEPLOYMENTS == 'true' && needs.release.outputs.prerelease != 'true'
    needs: [release, build, staging]
    uses: ./.github/workflows/deploy.yaml
    permissions:
      contents: read
      packages: read
      attestations: read
      id-token: write
    with:
      environment: production
      digest: ${{ needs.build.outputs.digest }}
      source-sha: ${{ needs.release.outputs.sha }}
